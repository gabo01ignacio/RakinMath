<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Rakín - Búho con lentes (Waving/Saludando) -->
  <!-- Cuerpo -->
  <ellipse cx="60" cy="68" rx="38" ry="40" fill="#af52de"/>
  <ellipse cx="60" cy="68" rx="38" ry="40" fill="url(#bodyGrad5)" opacity="0.3"/>
  
  <!-- Panza -->
  <ellipse cx="60" cy="78" rx="24" ry="26" fill="#f5f0ff"/>
  
  <!-- Orejas/plumas -->
  <path d="M30 38 L22 18 L40 32 Z" fill="#9333ea"/>
  <path d="M90 38 L98 18 L80 32 Z" fill="#9333ea"/>
  
  <!-- Ojos (felices) -->
  <circle cx="46" cy="52" r="10" fill="white"/>
  <circle cx="74" cy="52" r="10" fill="white"/>
  <circle cx="47" cy="52" r="5" fill="#1d1d1f"/>
  <circle cx="75" cy="52" r="5" fill="#1d1d1f"/>
  <circle cx="48.5" cy="50.5" r="2" fill="white"/>
  <circle cx="76.5" cy="50.5" r="2" fill="white"/>
  
  <!-- Lentes -->
  <circle cx="46" cy="52" r="13" fill="none" stroke="#007aff" stroke-width="3"/>
  <circle cx="74" cy="52" r="13" fill="none" stroke="#007aff" stroke-width="3"/>
  <path d="M59 52 L61 52" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 50 L26 46" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M87 50 L94 46" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pico (sonriente) -->
  <path d="M52 63 Q60 68 68 63" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Ala izquierda (normal) -->
  <ellipse cx="24" cy="72" rx="8" ry="18" fill="#9333ea" transform="rotate(-10 24 72)"/>
  
  <!-- Ala derecha (saludando - arriba) -->
  <ellipse cx="98" cy="48" rx="8" ry="16" fill="#9333ea" transform="rotate(50 98 48)"/>
  
  <!-- Mano/pata saludando -->
  <circle cx="106" cy="36" r="5" fill="#f5f0ff" stroke="#9333ea" stroke-width="2"/>
  
  <!-- Líneas de movimiento -->
  <path d="M112 30 L118 26" stroke="#ffc800" stroke-width="2" stroke-linecap="round"/>
  <path d="M114 36 L120 36" stroke="#ffc800" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 42 L118 46" stroke="#ffc800" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Patas -->
  <path d="M46 104 L40 114 M46 104 L46 114 M46 104 L52 114" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M74 104 L68 114 M74 104 L74 114 M74 104 L80 114" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round"/>
  
  <defs>
    <linearGradient id="bodyGrad5" x1="60" y1="28" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.4"/>
      <stop offset="1" stop-color="black" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
