<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Rakín - Búho con lentes (Happy/Celebrando) -->
  <!-- Cuerpo -->
  <ellipse cx="60" cy="68" rx="38" ry="40" fill="#af52de"/>
  <ellipse cx="60" cy="68" rx="38" ry="40" fill="url(#bodyGrad2)" opacity="0.3"/>
  
  <!-- Panza -->
  <ellipse cx="60" cy="78" rx="24" ry="26" fill="#f5f0ff"/>
  
  <!-- Orejas/plumas -->
  <path d="M30 38 L22 18 L40 32 Z" fill="#9333ea"/>
  <path d="M90 38 L98 18 L80 32 Z" fill="#9333ea"/>
  
  <!-- Ojos (felices - curvos) -->
  <path d="M38 50 Q46 44 54 50" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M66 50 Q74 44 82 50" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Lentes -->
  <circle cx="46" cy="52" r="13" fill="none" stroke="#007aff" stroke-width="3"/>
  <circle cx="74" cy="52" r="13" fill="none" stroke="#007aff" stroke-width="3"/>
  <path d="M59 52 L61 52" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 50 L26 46" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M87 50 L94 46" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pico (sonriente) -->
  <path d="M52 63 Q60 70 68 63" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Alas (arriba - celebrando) -->
  <ellipse cx="20" cy="62" rx="8" ry="18" fill="#9333ea" transform="rotate(-30 20 62)"/>
  <ellipse cx="100" cy="62" rx="8" ry="18" fill="#9333ea" transform="rotate(30 100 62)"/>
  
  <!-- Patas -->
  <path d="M46 104 L40 114 M46 104 L46 114 M46 104 L52 114" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M74 104 L68 114 M74 104 L74 114 M74 104 L80 114" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Estrellas de celebración -->
  <text x="14" y="28" font-size="14" fill="#ffc800">⭐</text>
  <text x="96" y="28" font-size="14" fill="#ffc800">⭐</text>
  <text x="8" y="80" font-size="10" fill="#ff9600">✨</text>
  <text x="104" y="80" font-size="10" fill="#ff9600">✨</text>
  
  <defs>
    <linearGradient id="bodyGrad2" x1="60" y1="28" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.4"/>
      <stop offset="1" stop-color="black" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
