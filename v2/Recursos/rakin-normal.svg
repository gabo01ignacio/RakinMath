  <circle cx="74" cy="52" r="10" fill="white"/>
  <circle cx="47" cy="52" r="5" fill="#1d1d1f"/>
  <circle cx="75" cy="52" r="5" fill="#1d1d1f"/>
  <circle cx="48.5" cy="50.5" r="2" fill="white"/>
  <circle cx="76.5" cy="50.5" r="2" fill="white"/>
  
