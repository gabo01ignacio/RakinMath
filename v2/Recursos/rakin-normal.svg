  <ellipse cx="60" cy="68" rx="38" ry="40" fill="url(#bodyGrad)" opacity="0.3"/>
  
  <!-- Panza -->
  <ellipse cx="60" cy="78" rx="24" ry="26" fill="#f5f0ff"/>
  
