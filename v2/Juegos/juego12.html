<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apple-design.css">
<script src="../auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="../stats/rk-stats.js"></script>
<script src="rk-feedback.js"></script>
<title>Geometrix Builder | RakinMath</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
}

.nav {
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border-bottom: 1.5px solid var(--border);
  flex-shrink: 0;
}

.nav-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 900;
  font-size: 1rem;
  color: var(--text);
}

.exit-btn {
  padding: 6px 14px;
  border-radius: 99px;
  background: rgba(255,59,48,0.1);
  color: #dc2626;
  font-weight: 800;
  font-size: 0.8125rem;
  border: none;
  cursor: pointer;
}

.game-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px 14px env(safe-area-inset-bottom, 8px);
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  gap: 6px;
  min-height: 0;
}

.top-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  font-weight: 800;
  font-size: 0.85rem;
  color: #1e293b;
}

/* CHALLENGE CARD */
.challenge-card {
  background: linear-gradient(145deg, #ecfdf5 0%, #d1fae5 100%);
  border: 2.5px solid #059669;
  border-radius: 18px;
  padding: 10px 14px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(5,150,105,0.15), 0 3px 0 #047857;
}

.challenge-tag {
  font-size: 0.725rem;
  font-weight: 900;
  text-transform: uppercase;
  color: #047857;
  letter-spacing: 0.05em;
}

.challenge-val {
  font-size: 1.2rem;
  font-weight: 900;
  color: #0f172a;
  margin-top: 2px;
}

/* INTERACTIVE GEO-GRID */
.geo-board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 4px;
  background: #ffffff;
  border: 2.5px solid #059669;
  border-radius: 20px;
  padding: 10px;
  aspect-ratio: 6 / 5;
  max-height: min(220px, 45vh);
  margin: 0 auto;
  width: 100%;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
}

.geo-cell {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  touch-action: manipulation;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.geo-cell:hover { background: #e2e8f0; }
.geo-cell.active {
  background: #10b981 !important;
  border-color: #047857;
  box-shadow: inset 0 0 0 2px #047857;
}
.geo-cell.active::after {
  content: '🟦';
  font-size: 0.8rem;
  opacity: 0.7;
}

/* LIVE STATS DISPLAY */
.live-pills {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.live-pill {
  flex: 1;
  background: var(--bg-card-solid);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 6px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.825rem;
  font-weight: 800;
  color: #1e293b;
}
.live-pill b { color: #059669; font-size: 1.05rem; }

/* QUICK TOOLS */
.quick-tools {
  display: flex;
  gap: 6px;
}

.tool-btn {
  flex: 1;
  font-family: var(--font-sans);
  padding: 8px 4px;
  font-size: 0.775rem;
  font-weight: 800;
  border-radius: 12px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-card);
  color: #1e293b;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.15s ease;
}
.tool-btn:active { transform: scale(0.95); }
.tool-btn.danger { color: #dc2626; border-color: #fca5a5; background: #fee2e2; }

.submit-btn {
  width: 100%;
  padding: 12px;
  min-height: 48px;
  background: linear-gradient(135deg, #059669, #047857);
  color: #ffffff;
  font-weight: 900;
  font-size: 1rem;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 0 #064e3b;
  touch-action: manipulation;
}
.submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #064e3b; }

@media (max-width: 480px) {
  .game-wrap { padding: 6px 10px env(safe-area-inset-bottom, 6px); gap: 6px; }
  .challenge-card { padding: 8px 10px; }
  .challenge-val { font-size: 1.05rem; }
  .geo-board { max-height: min(190px, 40vh); }
}
</style>
<!-- SUPER RESPONSIVE MOBILE OPTIMIZATIONS — RAKINMATH -->
<style id="rakin-mobile-responsiveness">
* { -webkit-tap-highlight-color: transparent; }
html, body { max-width: 100%; overflow-x: hidden; }
img, svg, video, canvas { max-width: 100%; }
button, a, input, select, textarea, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn {
  touch-action: manipulation;
}
@media (max-width: 600px) {
  input, select, textarea { font-size: 16px !important; }
  button, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn { min-height: 44px; }
}
</style>
</head>
<body class="game-bg game-geometrix">

<nav class="nav">
  <div class="nav-title">
    <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height:22px;width:auto">
    <span>Geometrix Builder</span>
  </div>
  <button class="exit-btn" onclick="window.location.href='menu-v3.html'">Salir</button>
</nav>

<div class="game-wrap">
  <div class="top-stats">
    <div class="stat-pill">📐 Estructuras: <b id="score" style="color:#059669">0</b></div>
    <div class="stat-pill" id="lives-pill">❤️❤️❤️</div>
  </div>

  <div class="challenge-card">
    <div class="challenge-tag" id="c-tag">🏗️ Reto de Arquitectura Geométrica</div>
    <div class="challenge-val" id="c-text">Construye una figura con Área = 8 u²</div>
  </div>

  <!-- INTERACTIVE GRID -->
  <div class="geo-board" id="geo-board"></div>

  <div class="live-pills">
    <div class="live-pill">
      <span>🟦 Área construida:</span>
      <b id="live-area">0 u²</b>
    </div>
    <div class="live-pill">
      <span>📏 Perímetro:</span>
      <b id="live-peri">0 u</b>
    </div>
  </div>

  <div class="quick-tools">
    <button class="tool-btn" onclick="presetRect(2, 3)">2×3</button>
    <button class="tool-btn" onclick="presetRect(3, 3)">3×3</button>
    <button class="tool-btn" onclick="presetRect(4, 2)">4×2</button>
    <button class="tool-btn danger" onclick="clearGrid()">🗑️ Limpiar</button>
  </div>

  <button class="submit-btn" onclick="checkFigure()">✓ ¡Comprobar Construcción Geométrica!</button>
</div>

<script>
const COLS = 6, ROWS = 5;
let gridState = new Array(COLS * ROWS).fill(false);
let targetArea = 8, targetPeri = 12;
let isAreaGoal = true;
let score = 0, lives = 3;
let sessionTotal = 0, sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0, sessionRound = 0;

window.onload = function() {
  buildGridDOM();
  RK.Stats.showRoundModal('Geometrix Builder', '📐', function(rounds) {
    sessionTotal = rounds;
    sessionTimer = Date.now();
    newChallenge();
  });
};

function buildGridDOM() {
  const board = document.getElementById('geo-board');
  board.innerHTML = '';

  for (let i = 0; i < COLS * ROWS; i++) {
    const cell = document.createElement('div');
    cell.className = 'geo-cell';
    cell.dataset.idx = i;
    cell.onclick = function() {
      toggleCell(i);
    };
    board.appendChild(cell);
  }
}

function toggleCell(idx) {
  gridState[idx] = !gridState[idx];
  updateGridVisuals();
}

function updateGridVisuals() {
  const cells = document.querySelectorAll('.geo-cell');
  cells.forEach((c, idx) => {
    c.classList.toggle('active', gridState[idx]);
  });

  const { area, perimeter } = calculateMetrics();
  document.getElementById('live-area').textContent = `${area} u²`;
  document.getElementById('live-peri').textContent = `${perimeter} u`;
}

function calculateMetrics() {
  let area = 0;
  let perimeter = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const idx = r * COLS + c;
      if (gridState[idx]) {
        area++;
        // Count exposed edges
        if (r === 0 || !gridState[(r - 1) * COLS + c]) perimeter++; // Top
        if (r === ROWS - 1 || !gridState[(r + 1) * COLS + c]) perimeter++; // Bottom
        if (c === 0 || !gridState[r * COLS + (c - 1)]) perimeter++; // Left
        if (c === COLS - 1 || !gridState[r * COLS + (c + 1)]) perimeter++; // Right
      }
    }
  }
  return { area, perimeter };
}

function presetRect(w, h) {
  gridState.fill(false);
  for (let r = 1; r < 1 + h && r < ROWS; r++) {
    for (let c = 1; c < 1 + w && c < COLS; c++) {
      gridState[r * COLS + c] = true;
    }
  }
  updateGridVisuals();
}

function clearGrid() {
  gridState.fill(false);
  updateGridVisuals();
}

function newChallenge() {
  clearGrid();
  isAreaGoal = Math.random() < 0.6;

  if (isAreaGoal) {
    const areaOptions = [4, 6, 8, 9, 10, 12, 14, 15];
    targetArea = areaOptions[~~(Math.random() * areaOptions.length)];
    document.getElementById('c-tag').textContent = '🟦 Reto de Área Geométrica';
    document.getElementById('c-text').textContent = `Construye una figura con Área = ${targetArea} u²`;
  } else {
    const periOptions = [10, 12, 14, 16, 18];
    targetPeri = periOptions[~~(Math.random() * periOptions.length)];
    document.getElementById('c-tag').textContent = '📏 Reto de Perímetro';
    document.getElementById('c-text').textContent = `Construye una figura con Perímetro = ${targetPeri} u`;
  }
}

function checkFigure() {
  const { area, perimeter } = calculateMetrics();
  if (area === 0) {
    RK.Feedback.show('error', 'Toca las casillas de la grilla para dibujar tu figura 📐');
    return;
  }

  sessionRound++;
  const isMatch = isAreaGoal ? (area === targetArea) : (perimeter === targetPeri);

  if (isMatch) {
    score += 10;
    sessionCorrect++;
    document.getElementById('score').textContent = score;
    RK.Feedback.show('success', `¡Magnífico arquitecto! Meta cumplida: ${isAreaGoal ? area + ' u²' : perimeter + ' u'} ✨`);

    if (sessionTotal > 0 && sessionRound >= sessionTotal) {
      setTimeout(endGame, 900);
    } else {
      setTimeout(newChallenge, 1200);
    }
  } else {
    lives--;
    sessionWrong++;
    document.getElementById('lives-pill').textContent = '❤️'.repeat(Math.max(0, lives));
    RK.Feedback.show('error', `Tu figura tiene ${isAreaGoal ? 'Área = ' + area + ' u²' : 'Perímetro = ' + perimeter + ' u'}. La meta es ${isAreaGoal ? targetArea + ' u²' : targetPeri + ' u'}`);

    if (lives <= 0 || (sessionTotal > 0 && sessionRound >= sessionTotal)) {
      setTimeout(endGame, 900);
    }
  }
}

function endGame() {
  const totalTime = Math.round((Date.now() - sessionTimer) / 1000);
  RK.Stats.saveGameResult('juego12', {
    score: score,
    rounds: sessionRound,
    totalTime: totalTime,
    correct: sessionCorrect,
    wrong: sessionWrong,
    errors: ['geometría', 'área y perímetro en grilla']
  });
  RK.Stats.showEndModal('Geometrix Builder', {
    score: score,
    rounds: sessionRound,
    totalTime: totalTime,
    correct: sessionCorrect,
    wrong: sessionWrong
  });
}
</script>
</body>
</html>
