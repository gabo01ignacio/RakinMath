<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="apple-design.css">
    <script src="../auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="../stats/rk-stats.js"></script>
    <title>Estimaciones | RakinMath</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .game-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 16px;
            gap: 10px;
            overflow: hidden;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .instruction {
            background: rgba(255,149,0,0.06);
            border: 1px solid rgba(255,149,0,0.12);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .instruction strong { color: var(--text); }

        .question-card {
            background: var(--bg-card-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            text-align: center;
        }

        .q-label {
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            margin-bottom: 6px;
        }

        .q-value {
            font-size: clamp(1.75rem, 8vw, 2.5rem);
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .opt-btn {
            font-family: var(--font-sans);
            background: var(--bg-card-solid);
            border: 1.5px solid var(--border-strong);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .opt-btn:active { transform: scale(0.96); }

        .opt-btn:hover {
            border-color: var(--accent);
            background: rgba(0,122,255,0.03);
        }

        .feedback {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            min-height: 20px;
        }
        .feedback.ok { color: var(--green); }
        .feedback.fail { color: var(--red); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease; }

        @media (max-width: 480px) {
            .game-wrap { padding: 8px 12px 12px; }
            .question-card { padding: 20px 14px; }
            .q-value { font-size: 1.5rem; }
            .opt-btn { padding: 14px 10px; font-size: 1rem; }
            .stat-pill { padding: 5px 10px; font-size: 0.8125rem; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="menu.html" class="nav-title">
        <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height: 24px; width: auto;">
        <span>Estimaciones | Rakin<span class="brand">Math</span></span>
    </a>
    <a href="menu.html" class="exit-btn">Salir</a>
</nav>

<div class="game-wrap" id="wrap">
    <div class="top-row">
        <div class="stat-pill">⭐ <span id="score">0</span></div>
        <div class="stat-pill"><span id="lives">❤️❤️❤️</span></div>
    </div>

    <div class="instruction">
        Redondea los números y elige la <strong>estimación</strong> más cercana.
    </div>

    <div class="question-card">
        <div class="q-label">Multiplicación</div>
        <div id="display-q" class="q-value">48 × 21</div>
    </div>

    <div class="options" id="options"></div>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    let score = 0, lives = 3, correct = 0, sessionTotal = 0, sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0, sessionRound = 0;

    window.onload = function() {
        RK.Stats.showRoundModal('Estimaciones', '📐', function(rounds) {
            sessionTotal = rounds;
            sessionTimer = Date.now();
            generate();
        });
    };

    function generate() {
        const fb = document.getElementById('feedback');
        fb.textContent = '';
        fb.className = 'feedback';

        const n1 = ~~(Math.random()*85)+12;
        const n2 = ~~(Math.random()*85)+12;
        const r1 = Math.round(n1/10)*10;
        const r2 = Math.round(n2/10)*10;
        correct = r1 * r2;

        document.getElementById('display-q').textContent = n1 + ' × ' + n2;

        let opts = [correct];
        while (opts.length < 4) {
            let f = (Math.round((Math.random()*100+10)/10)*10) * (Math.round((Math.random()*90)/10)*10);
            if (!opts.includes(f) && f !== 0) opts.push(f);
        }
        opts.sort((a,b) => a-b);

        const c = document.getElementById('options');
        c.innerHTML = '';
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.textContent = '≈ ' + o;
            b.onclick = () => pick(o);
            c.appendChild(b);
        });
    }

    function pick(val) {
        const fb = document.getElementById('feedback');
        sessionRound++;
        if (val === correct) {
            score += 10;
            sessionCorrect++;
            fb.textContent = '¡Correcto!';
            fb.className = 'feedback ok';
            document.getElementById('score').textContent = score;
        } else {
            lives--;
            sessionWrong++;
            fb.textContent = 'Era ≈ ' + correct;
            fb.className = 'feedback fail';
            document.getElementById('wrap').classList.add('shake');
            setTimeout(() => document.getElementById('wrap').classList.remove('shake'), 300);
            document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0,lives));
        }

        if (lives <= 0 || (sessionTotal > 0 && sessionRound >= sessionTotal)) {
            setTimeout(endGame, 600);
        } else {
            setTimeout(generate, 1000);
        }
    }

    function endGame() {
        var totalTime = Math.round((Date.now() - sessionTimer) / 1000);
        RK.Stats.saveGameResult('juego2', {
            score: score,
            rounds: sessionRound,
            totalTime: totalTime,
            correct: sessionCorrect,
            wrong: sessionWrong,
            errors: ['estimaciones', 'redondeo']
        });
        RK.Stats.showEndModal('Estimaciones', {
            score: score,
            rounds: sessionRound,
            totalTime: totalTime,
            correct: sessionCorrect,
            wrong: sessionWrong
        });
    }
</script>
</body>
</html>
