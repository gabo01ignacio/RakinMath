<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="apple-design.css">
    <script src="../auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="../stats/rk-stats.js"></script>
    <title>Buscatesoros | RakinMath</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            padding: var(--space-4) var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar h1 {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .stats-row {
            display: flex;
            gap: var(--space-4);
            font-size: 0.9375rem;
            font-weight: 600;
        }

        .game-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--space-5);
            padding: 0 var(--space-6) var(--space-6);
            min-height: 0;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-radius: var(--radius-2xl);
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            box-shadow: var(--shadow-md);
            overflow-y: auto;
            animation: slideUp 500ms var(--ease-spring-out) both;
        }

        .level-badge {
            text-align: center;
        }

        .level-badge .icon {
            font-size: 2.5rem;
            margin-bottom: var(--space-2);
        }

        .level-badge .text {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .coord-input-card {
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            padding: var(--space-4);
            text-align: center;
        }

        .coord-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--indigo);
            margin-bottom: var(--space-3);
        }

        .coord-fields {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-tertiary);
        }

        .coord-input {
            width: 64px;
            height: 52px;
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
            font-family: var(--font-body);
            font-variant-numeric: tabular-nums;
            transition: border-color 150ms var(--ease-smooth),
                        box-shadow 150ms var(--ease-smooth);
        }

        .coord-input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(88, 86, 214, 0.15);
        }

        .sail-btn {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-xl);
            border: none;
            background: var(--green);
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 100ms var(--ease-out),
                        background 150ms var(--ease-smooth);
        }

        .sail-btn:active { transform: scale(0.97); }
        .sail-btn:hover { background: #2a9d4e; }

        .history-box {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .hint-text {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        /* Grid area */
        .grid-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-2xl);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-5);
            box-shadow: var(--shadow-sm);
            animation: scaleIn 500ms var(--ease-spring-out) 100ms both;
        }

        .grid-world {
            position: relative;
            width: 600px;
            height: 500px;
            background: #e8f4f8;
            border-left: 3px solid var(--text-primary);
            border-bottom: 3px solid var(--text-primary);
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .axis-num {
            position: absolute;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-tertiary);
        }

        .game-entity {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-25px, 25px);
            z-index: 5;
        }

        .ship {
            font-size: 2.25rem;
            z-index: 10;
            transition: left 500ms var(--ease-spring-out),
                        bottom 500ms var(--ease-spring-out);
        }

        .treasure {
            font-size: 2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
            animation: bounce 2s var(--ease-smooth) infinite;
        }

        .obstacle {
            font-size: 1.5rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-25px, 25px) translateY(0); }
            50% { transform: translate(-25px, 25px) translateY(-4px); }
        }

        .status-bubble {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-pill);
            font-size: 0.8125rem;
            font-weight: 700;
            display: none;
            z-index: 100;
            color: white;
            box-shadow: var(--shadow-md);
        }

        .status-bubble.show {
            display: block;
            animation: popIn 300ms var(--ease-spring-out) both;
        }

        @media (max-width: 900px) {
            .game-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                padding: 0 var(--space-4) var(--space-4);
                gap: var(--space-3);
            }
            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--space-3);
                padding: var(--space-3);
                max-height: none;
            }
            .level-badge { grid-column: 1 / -1; text-align: center; }
            .coord-input-card { grid-column: 1 / -1; }
            .sail-btn { grid-column: 1 / -1; }
            .history-box { grid-column: 1 / -1; max-height: 80px; }
            .hint-text { grid-column: 1 / -1; }
            .grid-world { width: 100%; height: 300px; }
            .top-bar { padding: var(--space-3) var(--space-4); }
            .top-bar h1 { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .sidebar { grid-template-columns: 1fr; }
            .grid-world { height: 250px; }
            .coord-input { width: 56px; height: 44px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="menu.html" class="nav-title">
            <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height: 24px; width: auto;">
            <span>Buscatesoros | Rakin<span class="brand">Math</span></span>
        </a>
        <a href="menu.html" class="exit-btn">Salir</a>
    </nav>

    <div class="top-bar">
        <h1>🏴‍☠️ Buscatesoros</h1>
        <div class="stats-row">
            <span>💎 <span id="score">0</span></span>
            <span>❤️ <span id="lives">3</span></span>
        </div>
    </div>

    <div class="game-layout">
        <div class="sidebar">
            <div class="level-badge">
                <div class="icon">🗺️</div>
                <div class="text" id="level-text"><b>Nivel 1: Aguas Tranquilas</b></div>
            </div>

            <div class="coord-input-card">
                <div class="coord-label">Objetivo: <span id="mission-hint">? , ?</span></div>
                <div class="coord-fields">
                    (<input type="number" id="inpX" class="coord-input" min="0" max="12" value="0">,
                    <input type="number" id="inpY" class="coord-input" min="0" max="10" value="0">)
                </div>
            </div>

            <button class="sail-btn" onclick="moveToCoords()">¡Zarpar! ⛵</button>

            <div class="history-box" id="history">
                <div style="font-weight: 600; margin-bottom: var(--space-1);">Movimientos</div>
            </div>

            <div class="hint-text">
                💡 Busca el diamante 💎 y escribe su posición (X, Y). Cuidado con las bombas 💣.
            </div>
        </div>

        <div class="grid-container">
            <div id="status-bubble" class="status-bubble"></div>
            <div id="grid-world" class="grid-world">
                <div id="ship" class="game-entity ship">⛵</div>
                <div id="treasure" class="game-entity treasure">💎</div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let lives = 3;
        let targetX = 0;
        let targetY = 0;
        let obstacles = [];
        const step = 50;
        let sessionTotal = 0, sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0;

        window.onload = function() {
            RK.Stats.showRoundModal('Buscatesoros', '🏴‍☠️', function(rounds) {
                sessionTotal = rounds;
                sessionTimer = Date.now();
                createNumbers();
                spawnGameElements();
                resetShip();
            });
        };

        function createNumbers() {
            const grid = document.getElementById('grid-world');
            for (let x = 0; x <= 12; x++) {
                let n = document.createElement('div');
                n.className = 'axis-num';
                n.innerText = x;
                n.style.left = (x * step - 5) + "px";
                n.style.bottom = "-22px";
                grid.appendChild(n);
            }
            for (let y = 0; y <= 10; y++) {
                let n = document.createElement('div');
                n.className = 'axis-num';
                n.innerText = y;
                n.style.left = "-20px";
                n.style.bottom = (y * step - 8) + "px";
                grid.appendChild(n);
            }
        }

        function spawnGameElements() {
            document.querySelectorAll('.obstacle').forEach(e => e.remove());
            obstacles = [];

            targetX = Math.floor(Math.random() * 12) + 1;
            targetY = Math.floor(Math.random() * 10) + 1;

            const t = document.getElementById('treasure');
            t.style.left = (targetX * step) + "px";
            t.style.bottom = (targetY * step) + "px";

            if (score > 3) {
                let numBombs = Math.min(score - 2, 5);
                for (let i = 0; i < numBombs; i++) {
                    let bx = Math.floor(Math.random() * 12) + 1;
                    let by = Math.floor(Math.random() * 10) + 1;
                    if ((bx !== targetX || by !== targetY) && (bx !== 0 || by !== 0)) {
                        createObstacle(bx, by);
                        obstacles.push({ x: bx, y: by });
                    }
                }
                document.getElementById('level-text').innerHTML = "<b>Nivel 2: ¡Campo Minado! 💣</b>";
            }
        }

        function createObstacle(x, y) {
            const obs = document.createElement('div');
            obs.className = 'game-entity obstacle';
            obs.innerText = '💣';
            obs.style.left = (x * step) + "px";
            obs.style.bottom = (y * step) + "px";
            document.getElementById('grid-world').appendChild(obs);
        }

        function moveToCoords() {
            const x = parseInt(document.getElementById('inpX').value);
            const y = parseInt(document.getElementById('inpY').value);

            if (isNaN(x) || isNaN(y) || x < 0 || x > 12 || y < 0 || y > 10) {
                msg("¡Coordenadas fuera de rango!", "var(--red)");
                return;
            }

            const ship = document.getElementById('ship');
            ship.style.left = (x * step) + "px";
            ship.style.bottom = (y * step) + "px";

            const hist = document.getElementById('history');
            hist.innerHTML += `<div>→ (${x}, ${y})</div>`;
            hist.scrollTop = hist.scrollHeight;

            setTimeout(() => checkCollision(x, y), 600);
        }

        function checkCollision(x, y) {
            const hitBomb = obstacles.some(obs => obs.x === x && obs.y === y);

            if (x === targetX && y === targetY) {
                score++;
                sessionCorrect++;
                document.getElementById('score').innerText = score;
                msg("💎 ¡Tesoro encontrado!", "var(--green)");
                if (sessionTotal > 0 && score >= sessionTotal) { endGame(); return; }
                resetShip();
                spawnGameElements();
            } else if (hitBomb) {
                lives--;
                sessionWrong++;
                document.getElementById('lives').innerText = "❤️".repeat(Math.max(0, lives));
                msg("💥 ¡Boom! Chocaste", "var(--red)");
                if (lives <= 0) { endGame(); }
                else { resetShip(); }
            } else {
                msg("🌊 Solo agua aquí...", "var(--blue)");
            }
        }

        function resetShip() {
            const ship = document.getElementById('ship');
            ship.style.left = "0px";
            ship.style.bottom = "0px";
            document.getElementById('inpX').value = 0;
            document.getElementById('inpY').value = 0;
        }

        function msg(txt, color) {
            const b = document.getElementById('status-bubble');
            b.innerText = txt;
            b.style.backgroundColor = color;
            b.className = 'status-bubble show';
            setTimeout(() => b.className = 'status-bubble', 1800);
        }

        function endGame() {
            var totalTime = Math.round((Date.now() - sessionTimer) / 1000);
            var totalMoves = sessionCorrect + sessionWrong;
            RK.Stats.saveGameResult('juego5', {
                score: score,
                rounds: totalMoves,
                totalTime: totalTime,
                correct: sessionCorrect,
                wrong: sessionWrong,
                errors: ['coordenadas', 'plano cartesiano']
            });
            RK.Stats.showEndModal('Buscatesoros', {
                score: score,
                rounds: totalMoves,
                totalTime: totalTime,
                correct: sessionCorrect,
                wrong: sessionWrong
            });
        }
    </script>
</body>
</html>
