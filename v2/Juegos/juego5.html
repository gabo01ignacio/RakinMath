<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apple-design.css">
<script src="../auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="../stats/rk-stats.js"></script>
<script src="rk-feedback.js"></script>
<title>Buscatesoros | RakinMath</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
}

.nav {
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border-bottom: 1.5px solid var(--border);
  flex-shrink: 0;
}

.nav-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 1rem;
  color: var(--text);
}

.exit-btn {
  padding: 6px 14px;
  border-radius: 99px;
  background: rgba(255,59,48,0.1);
  color: #ff3b30;
  font-weight: 700;
  font-size: 0.8125rem;
  border: none;
  cursor: pointer;
}

.game-layout {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 12px;
  padding: 10px 16px env(safe-area-inset-bottom, 10px);
  align-items: stretch;
  min-height: 0;
}

/* SIDEBAR */
.sidebar {
  background: var(--bg-card-solid);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: space-between;
  overflow-y: auto;
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
}

.top-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  font-weight: 800;
  font-size: 0.85rem;
}

.mission-card {
  background: linear-gradient(135deg, rgba(28,176,246,0.12) 0%, rgba(28,176,246,0.04) 100%);
  border: 2px solid rgba(28,176,246,0.3);
  border-radius: 18px;
  padding: 12px;
  text-align: center;
}

.mission-tag {
  font-size: 0.725rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #0284c7;
  margin-bottom: 4px;
}

.mission-text {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
}

.target-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 14px;
  border-radius: 99px;
  background: #0284c7;
  color: white;
  font-size: 1.25rem;
  font-weight: 900;
  letter-spacing: 1px;
}

/* STEPPER CONTROLS */
.coord-steppers {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg-subtle, #f8fafc);
  border: 1px solid var(--border);
  padding: 10px;
  border-radius: 16px;
}

.stepper-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 3px 8px;
}

.stepper-label {
  font-size: 0.8125rem;
  font-weight: 800;
  color: var(--text-sec);
  min-width: 65px;
}

.stepper-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #1cb0f6;
  color: white;
  font-size: 1.2rem;
  font-weight: 900;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}
.stepper-btn:active { transform: scale(0.92); }

.stepper-val {
  font-size: 1.1rem;
  font-weight: 900;
  min-width: 32px;
  text-align: center;
}

.sail-btn {
  width: 100%;
  padding: 12px;
  min-height: 48px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, #34c759, #28a745);
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 0 #1e7e34;
  transition: transform 0.1s ease;
  touch-action: manipulation;
}
.sail-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e7e34; }

/* GRID WORLD CONTAINER */
.grid-container {
  background: #e0f2fe;
  border-radius: 20px;
  border: 2px solid #7dd3fc;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  touch-action: none;
}

.grid-board {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 500px;
  max-height: 500px;
  aspect-ratio: 1 / 1;
  background: linear-gradient(180deg, #bae6fd 0%, #7dd3fc 100%);
  border-left: 3px solid #0284c7;
  border-bottom: 3px solid #0284c7;
  border-radius: 12px;
  box-shadow: inset 0 0 20px rgba(2,132,199,0.15);
  cursor: crosshair;
}

.grid-cell-line-x, .grid-cell-line-y {
  position: absolute;
  background: rgba(2,132,199,0.2);
}

.axis-label {
  position: absolute;
  font-size: 0.75rem;
  font-weight: 800;
  color: #0369a1;
}
.axis-label.x-axis { bottom: -22px; transform: translateX(-50%); }
.axis-label.y-axis { left: -22px; transform: translateY(50%); }

.axis-title {
  position: absolute;
  font-size: 0.7rem;
  font-weight: 900;
  color: #0284c7;
  text-transform: uppercase;
}
.axis-title.x { bottom: -28px; right: 0; }
.axis-title.y { top: -16px; left: -20px; }

/* ENTITIES ON MAP */
.map-entity {
  position: absolute;
  font-size: 1.75rem;
  transform: translate(-50%, 50%);
  transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
  pointer-events: none;
  z-index: 10;
}

.treasure-item {
  animation: floatTreasure 1.8s ease-in-out infinite alternate;
}
@keyframes floatTreasure {
  from { transform: translate(-50%, 50%) translateY(0); }
  to { transform: translate(-50%, 50%) translateY(-6px); }
}

.target-marker {
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2.5px dashed #ff9500;
  border-radius: 50%;
  transform: translate(-50%, 50%);
  animation: pulseMarker 1s infinite alternate;
  pointer-events: none;
}
@keyframes pulseMarker {
  from { transform: translate(-50%, 50%) scale(0.9); opacity: 0.6; }
  to { transform: translate(-50%, 50%) scale(1.3); opacity: 1; }
}

@media (max-width: 768px) {
  .game-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    padding: 8px 10px env(safe-area-inset-bottom, 8px);
    gap: 8px;
  }
  .sidebar { padding: 10px; gap: 8px; border-radius: 16px; }
  .grid-container { padding: 16px 20px 20px 24px; }
  .mission-card { padding: 8px 10px; }
  .mission-text { font-size: 0.8rem; }
  .target-badge { font-size: 1.1rem; padding: 2px 10px; }
}
</style>
<!-- SUPER RESPONSIVE MOBILE OPTIMIZATIONS — RAKINMATH -->
<style id="rakin-mobile-responsiveness">
* { -webkit-tap-highlight-color: transparent; }
html, body { max-width: 100%; overflow-x: hidden; }
img, svg, video, canvas { max-width: 100%; }
button, a, input, select, textarea, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn {
  touch-action: manipulation;
}
@media (max-width: 600px) {
  input, select, textarea { font-size: 16px !important; }
  button, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn { min-height: 44px; }
}
</style>
</head>
<body class="game-bg game-buscatesoros">

<nav class="nav">
  <div class="nav-title">
    <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height:22px;width:auto">
    <span>Buscatesoros</span>
  </div>
  <button class="exit-btn" onclick="window.location.href='menu-v3.html'">Salir</button>
</nav>

<div class="game-layout">
  <div class="sidebar">
    <div class="top-stats">
      <div class="stat-pill">💎 <span id="score">0</span></div>
      <div class="stat-pill" id="lives-pill">❤️❤️❤️</div>
    </div>

    <div class="mission-card">
      <div class="mission-tag">🎯 Misión de Navegación</div>
      <div class="mission-text" id="mission-text">Navega hacia las coordenadas del tesoro o toca el mapa:</div>
      <div class="target-badge" id="target-coords">(3, 4)</div>
    </div>

    <div class="coord-steppers">
      <div class="stepper-row">
        <span class="stepper-label">➡️ Eje X</span>
        <button class="stepper-btn" onclick="adjustX(-1)">-</button>
        <span class="stepper-val" id="val-x">0</span>
        <button class="stepper-btn" onclick="adjustX(1)">+</button>
      </div>
      <div class="stepper-row">
        <span class="stepper-label">⬆️ Eje Y</span>
        <button class="stepper-btn" onclick="adjustY(-1)">-</button>
        <span class="stepper-val" id="val-y">0</span>
        <button class="stepper-btn" onclick="adjustY(1)">+</button>
      </div>
    </div>

    <button class="sail-btn" onclick="sailToCoords()">¡Zarpar a la Posición! ⛵</button>
  </div>

  <div class="grid-container">
    <div class="grid-board" id="grid-board" onclick="onGridClick(event)">
      <!-- Axis lines and numbers built via JS -->
      <div class="map-entity treasure-item" id="treasure-el">💎</div>
      <div class="map-entity" id="ship-el">⛵</div>
      <div class="target-marker" id="marker-el"></div>
    </div>
  </div>
</div>

<script>
const GRID_SIZE = 6; // 0 to 6 on X and Y
let currX = 0, currY = 0;
let targetX = 3, targetY = 4;
let score = 0, lives = 3;
let sessionTotal = 0, sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0, sessionRound = 0;

window.onload = function() {
  buildGridLines();
  RK.Stats.showRoundModal('Buscatesoros', '🏴‍☠️', function(rounds) {
    sessionTotal = rounds;
    sessionTimer = Date.now();
    newRound();
  });
};

function buildGridLines() {
  const board = document.getElementById('grid-board');
  // clear old lines & labels
  board.querySelectorAll('.grid-cell-line-x, .grid-cell-line-y, .axis-label').forEach(e => e.remove());

  for (let i = 0; i <= GRID_SIZE; i++) {
    const pct = (i / GRID_SIZE) * 100;
    
    // Vertical line
    const vx = document.createElement('div');
    vx.className = 'grid-cell-line-x';
    vx.style.left = pct + '%';
    vx.style.top = '0';
    vx.style.bottom = '0';
    vx.style.width = '1px';
    board.appendChild(vx);

    // Horizontal line
    const hy = document.createElement('div');
    hy.className = 'grid-cell-line-y';
    hy.style.bottom = pct + '%';
    hy.style.left = '0';
    hy.style.right = '0';
    hy.style.height = '1px';
    board.appendChild(hy);

    // X axis label
    const lx = document.createElement('div');
    lx.className = 'axis-label x-axis';
    lx.textContent = i;
    lx.style.left = pct + '%';
    board.appendChild(lx);

    // Y axis label
    const ly = document.createElement('div');
    ly.className = 'axis-label y-axis';
    ly.textContent = i;
    ly.style.bottom = pct + '%';
    board.appendChild(ly);
  }
}

function updateEntitiesDOM() {
  const ship = document.getElementById('ship-el');
  const treasure = document.getElementById('treasure-el');
  const marker = document.getElementById('marker-el');

  ship.style.left = ((currX / GRID_SIZE) * 100) + '%';
  ship.style.bottom = ((currY / GRID_SIZE) * 100) + '%';

  treasure.style.left = ((targetX / GRID_SIZE) * 100) + '%';
  treasure.style.bottom = ((targetY / GRID_SIZE) * 100) + '%';

  marker.style.left = ((currX / GRID_SIZE) * 100) + '%';
  marker.style.bottom = ((currY / GRID_SIZE) * 100) + '%';

  document.getElementById('val-x').textContent = currX;
  document.getElementById('val-y').textContent = currY;
}

function adjustX(delta) {
  currX = Math.max(0, Math.min(GRID_SIZE, currX + delta));
  updateEntitiesDOM();
}

function adjustY(delta) {
  currY = Math.max(0, Math.min(GRID_SIZE, currY + delta));
  updateEntitiesDOM();
}

function onGridClick(e) {
  const board = document.getElementById('grid-board');
  const rect = board.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  // X goes left (0) to right (GRID_SIZE)
  // Y goes bottom (0) to top (GRID_SIZE)
  const gx = Math.max(0, Math.min(GRID_SIZE, Math.round((clickX / rect.width) * GRID_SIZE)));
  const gy = Math.max(0, Math.min(GRID_SIZE, Math.round(((rect.height - clickY) / rect.height) * GRID_SIZE)));

  currX = gx;
  currY = gy;
  updateEntitiesDOM();
  sailToCoords();
}

function newRound() {
  targetX = Math.floor(Math.random() * GRID_SIZE) + 1;
  targetY = Math.floor(Math.random() * GRID_SIZE) + 1;
  
  // reset ship to 0,0
  currX = 0;
  currY = 0;

  document.getElementById('target-coords').textContent = `(${targetX}, ${targetY})`;
  updateEntitiesDOM();
}

function sailToCoords() {
  sessionRound++;
  if (currX === targetX && currY === targetY) {
    score++;
    sessionCorrect++;
    document.getElementById('score').textContent = score;
    RK.Feedback.show('success', `¡Tesoro alcanzado en (${targetX}, ${targetY})! 💎✨`);
    
    if (sessionTotal > 0 && sessionRound >= sessionTotal) {
      setTimeout(endGame, 900);
    } else {
      setTimeout(newRound, 1200);
    }
  } else {
    lives--;
    sessionWrong++;
    document.getElementById('lives-pill').textContent = '❤️'.repeat(Math.max(0, lives));
    RK.Feedback.show('error', `Estás en (${currX}, ${currY}). El tesoro está en (${targetX}, ${targetY}) 🌊`);

    if (lives <= 0 || (sessionTotal > 0 && sessionRound >= sessionTotal)) {
      setTimeout(endGame, 900);
    }
  }
}

function endGame() {
  const totalTime = Math.round((Date.now() - sessionTimer) / 1000);
  RK.Stats.saveGameResult('juego5', {
    score: score,
    rounds: sessionRound,
    totalTime: totalTime,
    correct: sessionCorrect,
    wrong: sessionWrong,
    errors: ['plano cartesiano', 'coordenadas']
  });
  RK.Stats.showEndModal('Buscatesoros', {
    score: score,
    rounds: sessionRound,
    totalTime: totalTime,
    correct: sessionCorrect,
    wrong: sessionWrong
  });
}
</script>
</body>
</html>
