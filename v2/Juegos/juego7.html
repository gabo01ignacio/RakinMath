<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="apple-design.css">
    <script src="../auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="../stats/rk-stats.js"></script>
    <script src="rk-feedback.js"></script>
    <title>Misión Robot | RakinMath</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
        }

        .nav {
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border-bottom: 1.5px solid var(--border);
            flex-shrink: 0;
        }

        .nav-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--text);
        }

        .exit-btn {
            padding: 6px 14px;
            border-radius: 99px;
            background: rgba(255,59,48,0.1);
            color: #ff3b30;
            font-weight: 700;
            font-size: 0.8125rem;
            border: none;
            cursor: pointer;
        }

        .game-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 16px env(safe-area-inset-bottom, 10px);
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            gap: 8px;
            min-height: 0;
        }

        .top-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 99px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            font-weight: 800;
            font-size: 0.875rem;
        }

        /* TIMER BAR */
        .timer-track {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #34c759, #ff9500, #ff3b30);
            transition: width 0.1s linear;
        }

        /* ROBOT PATIENT CARD */
        .patient-card {
            background: linear-gradient(145deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(56,189,248,0.15), 0 3px 0 #0284c7;
            position: relative;
        }

        .animal-emoji {
            font-size: 2.8rem;
            line-height: 1;
            display: inline-block;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
            animation: bounceMascot 1s ease infinite alternate;
        }
        @keyframes bounceMascot {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        .op-text {
            font-size: clamp(2rem, 8vw, 2.75rem);
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-top: 4px;
            line-height: 1.1;
        }

        .answer-display {
            background: #ffffff;
            border: 2px solid #0284c7;
            border-radius: 14px;
            padding: 8px 16px;
            font-size: 1.75rem;
            font-weight: 900;
            color: #0284c7;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
        }

        /* ON-SCREEN KEYPAD */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .key-btn {
            font-family: var(--font-sans);
            padding: 12px 0;
            min-height: 48px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 14px;
            border: 1.5px solid var(--border-strong, #cbd5e1);
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 3px 0 #cbd5e1;
            transition: transform 0.1s ease, background 0.1s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #cbd5e1;
        }
        .key-btn.action-clear {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #dc2626;
            box-shadow: 0 3px 0 #f87171;
        }
        .key-btn.action-submit {
            background: #dcfce7;
            border-color: #86efac;
            color: #16a34a;
            box-shadow: 0 3px 0 #4ade80;
        }

        @media (max-width: 480px) {
            .game-wrap { padding: 6px 10px env(safe-area-inset-bottom, 6px); gap: 6px; }
            .patient-card { padding: 12px; }
            .animal-emoji { font-size: 2.2rem; }
            .op-text { font-size: 1.75rem; }
            .answer-display { min-height: 42px; font-size: 1.5rem; }
            .key-btn { min-height: 44px; font-size: 1.25rem; padding: 10px 0; }
        }
    </style>
<!-- SUPER RESPONSIVE MOBILE OPTIMIZATIONS — RAKINMATH -->
<style id="rakin-mobile-responsiveness">
* { -webkit-tap-highlight-color: transparent; }
html, body { max-width: 100%; overflow-x: hidden; }
img, svg, video, canvas { max-width: 100%; }
button, a, input, select, textarea, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn {
  touch-action: manipulation;
}
@media (max-width: 600px) {
  input, select, textarea { font-size: 16px !important; }
  button, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn { min-height: 44px; }
}
</style>
</head>
<body class="game-bg game-robot">

<nav class="nav">
    <div class="nav-title">
        <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height:22px;width:auto">
        <span>Misión Robot</span>
    </div>
    <button class="exit-btn" onclick="window.location.href='menu-v3.html'">Salir</button>
</nav>

<div class="game-wrap">
    <div>
        <div class="top-stats">
            <div class="stat-pill">🤖 Rescatados: <b id="score">0</b></div>
            <div class="stat-pill" id="combo-pill">🔥 Combo: <b id="combo">0</b></div>
            <div class="stat-pill">⏱️ <b id="time-text">60s</b></div>
        </div>
        <div class="timer-track" style="margin-top:4px">
            <div class="timer-fill" id="timer-bar" style="width: 100%"></div>
        </div>
    </div>

    <div class="patient-card" id="patient-card">
        <span id="patient-icon" class="animal-emoji">🐶</span>
        <div class="op-text" id="op-text">12 × 2</div>
    </div>

    <div class="answer-display" id="ans-display">_</div>

    <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn action-clear" onclick="pressKey('CLEAR')">⌫</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn action-submit" onclick="submitAnswer()">✓</button>
    </div>
</div>

<script>
    let score = 0, combo = 0;
    let timeLeft = 60, totalDuration = 60;
    let timerId = null;
    let currentAns = 0;
    let currentInput = "";
    let sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0, sessionTotal = 0, sessionRound = 0;
    const animals = ['🐶','🐱','🐰','🐹','🦊','🐼','🐨','🐷','🦁','🐸','🐵','🦄'];

    window.onload = function() {
        RK.Stats.showRoundModal('Misión Robot', '🤖', function(rounds) {
            sessionTotal = rounds;
            startGame();
        });
    };

    function startGame() {
        score = 0;
        combo = 0;
        timeLeft = 60;
        sessionTimer = Date.now();
        sessionRound = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;

        nextPatient();

        timerId = setInterval(() => {
            timeLeft -= 0.1;
            document.getElementById('timer-bar').style.width = Math.max(0, (timeLeft / totalDuration * 100)) + "%";
            document.getElementById('time-text').innerText = Math.ceil(Math.max(0, timeLeft)) + "s";
            if (timeLeft <= 0) endGame();
        }, 100);
    }

    function nextPatient() {
        currentInput = "";
        updateDisplay();
        document.getElementById('patient-icon').innerText = animals[Math.floor(Math.random() * animals.length)];

        const types = ['suma','resta','multi2','divi2','multi10','multi100'];
        const type = types[Math.floor(Math.random() * types.length)];
        let a, b, text;

        switch (type) {
            case 'suma':
                a = Math.floor(Math.random() * 60) + 15;
                b = Math.floor(Math.random() * 30) + 11;
                text = `${a} + ${b}`; currentAns = a + b;
                break;
            case 'resta':
                a = Math.floor(Math.random() * 50) + 40;
                b = Math.floor(Math.random() * 30) + 11;
                text = `${a} − ${b}`; currentAns = a - b;
                break;
            case 'multi2':
                a = Math.floor(Math.random() * 45) + 5;
                text = `${a} × 2`; currentAns = a * 2;
                break;
            case 'divi2':
                a = (Math.floor(Math.random() * 45) + 1) * 2;
                text = `${a} ÷ 2`; currentAns = a / 2;
                break;
            case 'multi10':
                a = Math.floor(Math.random() * 90) + 2;
                text = `${a} × 10`; currentAns = a * 10;
                break;
            case 'multi100':
                a = Math.floor(Math.random() * 9) + 1;
                text = `${a} × 100`; currentAns = a * 100;
                break;
        }

        document.getElementById('op-text').innerText = text;
    }

    function pressKey(k) {
        if (k === 'CLEAR') {
            currentInput = currentInput.slice(0, -1);
        } else {
            if (currentInput.length < 5) {
                currentInput += k;
            }
        }
        updateDisplay();

        // If input matches answer directly, auto-submit!
        if (parseInt(currentInput) === currentAns) {
            submitAnswer();
        }
    }

    function updateDisplay() {
        document.getElementById('ans-display').innerText = currentInput.length > 0 ? currentInput : '_';
    }

    // Keyboard support for desktop
    window.addEventListener('keydown', function(e) {
        if (e.key >= '0' && e.key <= '9') {
            pressKey(e.key);
        } else if (e.key === 'Backspace') {
            pressKey('CLEAR');
        } else if (e.key === 'Enter') {
            submitAnswer();
        }
    });

    function submitAnswer() {
        if (!currentInput) return;
        const val = parseInt(currentInput);
        sessionRound++;

        if (val === currentAns) {
            score++;
            combo++;
            sessionCorrect++;
            document.getElementById('score').innerText = score;
            document.getElementById('combo').innerText = combo;
            RK.Feedback.show('success', '¡Dosis correcta! 🤖✨');

            if (sessionTotal > 0 && sessionRound >= sessionTotal) {
                setTimeout(endGame, 700);
            } else {
                setTimeout(nextPatient, 200);
            }
        } else {
            combo = 0;
            sessionWrong++;
            document.getElementById('combo').innerText = combo;
            RK.Feedback.show('error', `¡Ups! Era ${currentAns}`);
            currentInput = "";
            updateDisplay();
        }
    }

    function endGame() {
        clearInterval(timerId);
        const totalTime = Math.round((Date.now() - sessionTimer) / 1000);
        RK.Stats.saveGameResult('juego7', {
            score: score,
            rounds: sessionRound,
            totalTime: totalTime,
            correct: sessionCorrect,
            wrong: sessionWrong,
            errors: ['suma', 'resta', 'multiplicación', 'división']
        });
        RK.Stats.showEndModal('Misión Robot', {
            score: score,
            rounds: sessionRound,
            totalTime: totalTime,
            correct: sessionCorrect,
            wrong: sessionWrong
        });
    }
</script>
</body>
</html>
