<head>

<title>El Caldero Mágico | RakinMath</title>
<style>
:root{--magic:#6c5ce7;--potion:#a29bfe;--gold:#fdcb6e;--cauldron:#2d1b69}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;color:#fff}
.game-layout{flex:1;display:grid;grid-template-columns:300px 1fr;gap:20px;padding:0 16px 16px;align-items:center}
.top-stats{display:flex;gap:10px;padding:0 16px}
.stat-pill{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-pill);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);font-weight:700;font-size:.875rem;backdrop-filter:blur(10px)}
.stat-pill .v{color:var(--gold);font-variant-numeric:tabular-nums}

/* Recipe card */
.recipe-card{background:rgba(255,255,255,.9);color:var(--text);border-radius:var(--radius-2xl);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);animation:slideUp 500ms var(--ease-spring-out) both}
.recipe-title{font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);text-align:center}
.target-circle{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--magic),var(--potion));color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:800;margin:0 auto;border:4px solid var(--gold);box-shadow:0 0 30px rgba(108,92,231,.4)}
.recipe-instructions{font-size:.8125rem;color:var(--text-secondary);line-height:1.6}
.recipe-instructions strong{color:var(--text)}
.recipe-reminder{font-size:.75rem;color:var(--text-tertiary);padding-top:12px;border-top:1px solid var(--border)}
.skip-btn{background:none;border:none;color:var(--magic);font-family:var(--font-sans);font-size:.8125rem;font-weight:600;cursor:pointer;text-decoration:underline;margin-top:auto;transition:opacity .15s}
.skip-btn:hover{opacity:.7}

/* Cauldron zone */
.cauldron-zone{display:flex;flex-direction:column;align-items:center;gap:24px;animation:scaleIn 500ms var(--ease-spring-out) 100ms both}
.equation-builder{display:flex;gap:16px;align-items:center;font-size:2.5rem;font-weight:800;background:rgba(255,255,255,.08);padding:24px 32px;border-radius:var(--radius-2xl);border:2px dashed rgba(255,255,255,.15);backdrop-filter:blur(10px)}
.num-fixed{color:#fff}
.slot{width:64px;height:64px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);transition:transform .15s var(--ease-spring-out),border-color .15s,background .15s;font-weight:800}
.slot:hover{background:rgba(255,255,255,.15)}
.slot.active{border-color:var(--gold);background:rgba(253,203,110,.15);transform:scale(1.08);box-shadow:0 0 20px rgba(253,203,110,.3)}
.spell-box{display:flex;gap:12px}
.spell-btn{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:linear-gradient(135deg,var(--magic),#5a4bd1);color:#fff;font-size:1.75rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;font-family:var(--font-sans);box-shadow:0 4px 0 #4a3cb5,0 6px 16px rgba(108,92,231,.3)}
.spell-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a3cb5,0 3px 8px rgba(108,92,231,.2)}
.spell-btn:hover{background:linear-gradient(135deg,#5a4bd1,var(--magic))}
.mix-btn{padding:14px 32px;border-radius:var(--radius-pill);border:none;background:linear-gradient(135deg,var(--green),#28a745);color:#fff;font-family:var(--font-sans);font-size:1.125rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;box-shadow:0 4px 0 #28a745,0 6px 16px rgba(52,199,89,.3)}
.mix-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #28a745,0 3px 8px rgba(52,199,89,.2)}

/* Decorative cauldron bubbles */
.bubble{position:absolute;border-radius:50%;background:rgba(108,92,231,.3);animation:bubbleRise 3s ease-in infinite;pointer-events:none}
@keyframes bubbleRise{0%{transform:translateY(0) scale(1);opacity:.6}100%{transform:translateY(-100px) scale(0);opacity:0}}

/* Magic particles */
.particles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);animation:particleFloat 6s linear infinite;opacity:.4}
@keyframes particleFloat{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

@media(max-width:900px){
  .game-layout{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:0 12px 12px;gap:12px}
  .recipe-card{padding:16px}
  .equation-builder{font-size:1.75rem;padding:16px;gap:12px}
  .slot{width:52px;height:52px}
  .spell-btn{width:56px;height:56px;font-size:1.25rem}
}
@media(max-width:480px){
  .target-circle{width:72px;height:72px;font-size:1.75rem}
  .equation-builder{font-size:1.25rem}
  .slot{width:44px;height:44px;font-size:1rem}
  .spell-btn{width:48px;height:48px;font-size:1rem}
}
</style>
<style>

  -webkit-tap-highlight-color: transparent;

  max-width: 100%;
  overflow-x: hidden;

img, svg, video, canvas {

<body class="game-bg game-caldero">

<!-- Magic particles background -->
<div class="particles" id="particles"></div>

<nav class="nav">
  <a href="menu-v3.html" class="nav-title">
    <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height:22px;width:auto">
    <span>El Caldero Mágico</span>
  </a>
  <button class="exit-btn" onclick="window.location.href='menu-v3.html'">Salir</button>
</nav>

<div class="top-stats">
  <div class="stat-pill">⭐ <span class="v" id="score">0</span></div>
</div>

<div class="game-layout">
  <div class="recipe-card">
    <div class="recipe-title">📜 Libro de Hechizos</div>
    <div class="target-circle" id="target-num">?</div>
    <div class="recipe-instructions">
      <strong>Instrucciones:</strong><br>
      1. Toca un cuadro <strong>"?"</strong>.<br>
      2. Elige un signo mágico.<br>
      3. ¡Mezcla la poción!
    </div>
    <div class="recipe-reminder">
      El caldero usa <b>PAPOMUDAS</b> (× y ÷ primero, luego + y −).
    </div>
    <button class="skip-btn" onclick="generateMission()">Saltar receta ↻</button>
  </div>

  <div class="cauldron-zone">
    <div class="equation-builder">
      <span class="num-fixed" id="n1">0</span>
      <div class="slot" onclick="selectSlot(this)" id="op1">?</div>
      <span class="num-fixed" id="n2">0</span>
      <div class="slot" onclick="selectSlot(this)" id="op2">?</div>
      <span class="num-fixed" id="n3">0</span>
    </div>

    <div class="spell-box">
      <button class="spell-btn" onclick="addOp('+')">+</button>
      <button class="spell-btn" onclick="addOp('-')">−</button>
      <button class="spell-btn" onclick="addOp('×')">×</button>
      <button class="spell-btn" onclick="addOp('÷')">÷</button>
    </div>

    <button class="mix-btn" onclick="cookPocion()">¡Mezclar poción! ✨</button>
  </div>
</div>

<script>
var activeSlot=null;
var score=0;
var currentTarget=0;
var sessionTotal=0,sessionCorrect=0,sessionWrong=0,sessionTimer=0,sessionRound=0;

/* Create magic particles */
(function(){
  var container=document.getElementById('particles');
  for(var i=0;i<15;i++){
    var p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=Math.random()*6+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    container.appendChild(p);
  }
})();

window.onload=function(){
  RK.Stats.showRoundModal('El Caldero Mágico','🧪',function(rounds){
    sessionTotal=rounds;
    sessionTimer=Date.now();
    generateMission();
  });
};

function generateMission(){
  var ops=['+','-','*','/'];
  var valid=false;
  while(!valid){
    var num1=Math.floor(Math.random()*15)+2;
    var num2=Math.floor(Math.random()*12)+2;
    var num3=Math.floor(Math.random()*10)+1;
    var opA=ops[Math.floor(Math.random()*ops.length)];
    var opB=ops[Math.floor(Math.random()*ops.length)];
    var expression=num1+' '+opA+' '+num2+' '+opB+' '+num3;
    var result=eval(expression);
    if(Number.isInteger(result)&&result>0&&result<150){
      currentTarget=result;
      document.getElementById('n1').innerText=num1;
      document.getElementById('n2').innerText=num2;
      document.getElementById('n3').innerText=num3;
      document.getElementById('target-num').innerText=result;
      valid=true;
    }
  }
  clearSlots();
}

function selectSlot(el){
  if(activeSlot)activeSlot.classList.remove('active');
  activeSlot=el;
  el.classList.add('active');
}

function addOp(op){
  if(!activeSlot)return;
  activeSlot.innerText=op;
  activeSlot.style.color='var(--gold)';
}

function cookPocion(){
  var op1=document.getElementById('op1').innerText;
  var op2=document.getElementById('op2').innerText;
  var n1=parseInt(document.getElementById('n1').innerText);
  var n2=parseInt(document.getElementById('n2').innerText);
  var n3=parseInt(document.getElementById('n3').innerText);
  if(op1==='?'||op2==='?'){
    RK.Feedback.show('error','¡Faltan ingredientes!','🧪');
    return;
  }
  var map={'+':'+','-':'-','×':'*','÷':'/'};
  var expression=n1+' '+map[op1]+' '+n2+' '+map[op2]+' '+n3;
  sessionRound++;
  try{
    var result=eval(expression);
    if(result===currentTarget){
      score+=15;sessionCorrect++;
      document.getElementById('score').innerText=score;
      RK.Feedback.show('success','¡Poción lograda!','✨');
      if(sessionTotal>0&&sessionRound>=sessionTotal){setTimeout(endGame,1000)}
      else{setTimeout(generateMission,1500)}
    }else{
      sessionWrong++;
      RK.Feedback.show('error','¡Explotó! Dio '+result,'💥');
    }
  }catch(e){
    sessionWrong++;
    RK.Feedback.show('error','¡Hechizo fallido!','🧪');
  }
}

function clearSlots(){
  document.getElementById('op1').innerText='?';
  document.getElementById('op2').innerText='?';
  document.getElementById('op1').style.color='';
  document.getElementById('op2').style.color='';
  if(activeSlot)activeSlot.classList.remove('active');
  activeSlot=null;
}

function endGame(){
  var totalTime=Math.round((Date.now()-sessionTimer)/1000);
  RK.Stats.saveGameResult('juego6',{
    score:score,rounds:sessionRound,totalTime:totalTime,
    correct:sessionCorrect,wrong:sessionWrong,
    errors:['orden de operaciones','PAPOMUDAS']
  });
  RK.Stats.showEndModal('El Caldero Mágico',{
    score:score,rounds:sessionRound,totalTime:totalTime,
    correct:sessionCorrect,wrong:sessionWrong
  });
}
</script>
</body>
</html>
