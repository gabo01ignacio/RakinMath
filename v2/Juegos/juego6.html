<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="apple-design.css">
    <script src="../auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="../stats/rk-stats.js"></script>
    <title>El Caldero Mágico | RakinMath</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --surface-dark: #16213e;
            --magic: #6c5ce7;
            --potion: #a29bfe;
            --gold: #fdcb6e;
        }

        body {
            background: var(--bg-dark);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .nav {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .nav-title { color: white; }
        .nav-logo-icon { background: var(--magic); }
        .nav-title .brand { color: var(--gold); }

        .exit-btn {
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .exit-btn:hover {
            color: white;
            background: rgba(255,255,255,0.12);
        }

        .top-bar {
            padding: var(--space-4) var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .top-bar h1 {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .score-pill {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-pill);
            background: rgba(255,255,255,0.08);
            font-weight: 700;
        }

        .game-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: var(--space-5);
            padding: 0 var(--space-6) var(--space-6);
            align-items: center;
        }

        /* Recipe card */
        .recipe-card {
            background: #dfe6e9;
            color: var(--text-primary);
            border-radius: var(--radius-2xl);
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            box-shadow: var(--shadow-lg);
            animation: slideUp 500ms var(--ease-spring-out) both;
        }

        .recipe-title {
            font-size: 0.8125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            text-align: center;
        }

        .target-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--magic);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto;
            border: 4px solid var(--gold);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
        }

        .recipe-instructions {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .recipe-instructions strong { color: var(--text-primary); }

        .recipe-reminder {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-subtle);
        }

        .skip-btn {
            background: none;
            border: none;
            color: var(--magic);
            font-family: var(--font-body);
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            margin-top: auto;
            transition: opacity 150ms var(--ease-smooth);
        }

        .skip-btn:hover { opacity: 0.7; }

        /* Cauldron zone */
        .cauldron-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-6);
            animation: scaleIn 500ms var(--ease-spring-out) 100ms both;
        }

        .equation-builder {
            display: flex;
            gap: var(--space-4);
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            background: rgba(255,255,255,0.06);
            padding: var(--space-6) var(--space-8);
            border-radius: var(--radius-2xl);
            border: 2px dashed rgba(255,255,255,0.1);
        }

        .num-fixed {
            color: white;
        }

        .slot {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--gold);
            transition: transform 150ms var(--ease-spring-out),
                        border-color 150ms var(--ease-smooth),
                        background 150ms var(--ease-smooth);
        }

        .slot:hover {
            background: rgba(255,255,255,0.12);
        }

        .slot.active {
            border-color: var(--gold);
            background: rgba(253, 203, 110, 0.15);
            transform: scale(1.05);
        }

        .spell-box {
            display: flex;
            gap: var(--space-4);
        }

        .spell-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            background: var(--magic);
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 100ms var(--ease-out),
                        background 150ms var(--ease-smooth);
            font-family: var(--font-body);
        }

        .spell-btn:active { transform: scale(0.9); }
        .spell-btn:hover { background: #5a4bd1; }

        .mix-btn {
            padding: var(--space-4) var(--space-8);
            border-radius: var(--radius-pill);
            border: none;
            background: var(--green);
            color: white;
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 100ms var(--ease-out),
                        background 150ms var(--ease-smooth);
        }

        .mix-btn:active { transform: scale(0.97); }
        .mix-btn:hover { background: #2a9d4e; }

        .feedback-msg {
            position: absolute;
            top: var(--space-6);
            font-size: 1.125rem;
            font-weight: 700;
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-pill);
            display: none;
            z-index: 10;
            color: white;
            box-shadow: var(--shadow-lg);
        }

        .feedback-msg.show {
            display: block;
            animation: popIn 300ms var(--ease-spring-out) both;
        }

        @media (max-width: 900px) {
            .game-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                padding: 0 var(--space-4) var(--space-4);
                gap: var(--space-3);
            }
            .recipe-card { padding: var(--space-4); }
            .equation-builder {
                font-size: 1.75rem;
                padding: var(--space-4);
                gap: var(--space-3);
            }
            .slot { width: 52px; height: 52px; }
            .spell-btn { width: 56px; height: 56px; font-size: 1.25rem; }
            .top-bar { padding: var(--space-3) var(--space-4); }
            .top-bar h1 { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .target-circle { width: 72px; height: 72px; font-size: 1.75rem; }
            .equation-builder { font-size: 1.25rem; }
            .slot { width: 44px; height: 44px; font-size: 1rem; }
            .spell-btn { width: 48px; height: 48px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="menu.html" class="nav-title">
            <img src="../Recursos/LogoRakinMath.png" alt="RakinMath" style="height: 24px; width: auto;">
            <span>El Caldero Mágico | Rakin<span class="brand">Math</span></span>
        </a>
        <a href="menu.html" class="exit-btn">Salir</a>
    </nav>

    <div class="top-bar">
        <h1>🧙‍♀️ El Caldero Mágico</h1>
        <div class="score-pill">⭐ <span id="score">0</span></div>
    </div>

    <div class="game-layout">
        <div class="recipe-card">
            <div class="recipe-title">📜 Libro de Hechizos</div>
            <div class="target-circle" id="target-num">?</div>
            <div class="recipe-instructions">
                <strong>Instrucciones:</strong><br>
                1. Toca un cuadro <strong>"?"</strong>.<br>
                2. Elige un signo mágico.<br>
                3. ¡Mezcla la poción!
            </div>
            <div class="recipe-reminder">
                El caldero usa <b>PAPOMUDAS</b> (× y ÷ primero, luego + y −).
            </div>
            <button class="skip-btn" onclick="generateMission()">Saltar receta ↻</button>
        </div>

        <div class="cauldron-zone">
            <div id="feedback" class="feedback-msg"></div>

            <div class="equation-builder">
                <span class="num-fixed" id="n1">0</span>
                <div class="slot" onclick="selectSlot(this)" id="op1">?</div>
                <span class="num-fixed" id="n2">0</span>
                <div class="slot" onclick="selectSlot(this)" id="op2">?</div>
                <span class="num-fixed" id="n3">0</span>
            </div>

            <div class="spell-box">
                <button class="spell-btn" onclick="addOp('+')">+</button>
                <button class="spell-btn" onclick="addOp('-')">−</button>
                <button class="spell-btn" onclick="addOp('×')">×</button>
                <button class="spell-btn" onclick="addOp('÷')">÷</button>
            </div>

            <button class="mix-btn" onclick="cookPocion()">¡Mezclar poción! ✨</button>
        </div>
    </div>

<script>
        let activeSlot = null;
        let score = 0;
        let currentTarget = 0;
        let sessionTotal = 0, sessionCorrect = 0, sessionWrong = 0, sessionTimer = 0, sessionRound = 0;

        window.onload = function() {
            RK.Stats.showRoundModal('El Caldero Mágico', '🧪', function(rounds) {
                sessionTotal = rounds;
                sessionTimer = Date.now();
                generateMission();
            });
        };

        function generateMission() {
            const ops = ['+', '-', '*', '/'];
            let valid = false;

            while (!valid) {
                const num1 = Math.floor(Math.random() * 15) + 2;
                const num2 = Math.floor(Math.random() * 12) + 2;
                const num3 = Math.floor(Math.random() * 10) + 1;
                const opA = ops[Math.floor(Math.random() * ops.length)];
                const opB = ops[Math.floor(Math.random() * ops.length)];

                const expression = `${num1} ${opA} ${num2} ${opB} ${num3}`;
                const result = eval(expression);

                if (Number.isInteger(result) && result > 0 && result < 150) {
                    currentTarget = result;
                    document.getElementById('n1').innerText = num1;
                    document.getElementById('n2').innerText = num2;
                    document.getElementById('n3').innerText = num3;
                    document.getElementById('target-num').innerText = result;
                    valid = true;
                }
            }
            clearSlots();
        }

        function selectSlot(el) {
            if (activeSlot) activeSlot.classList.remove('active');
            activeSlot = el;
            el.classList.add('active');
        }

        function addOp(op) {
            if (!activeSlot) return;
            activeSlot.innerText = op;
            activeSlot.style.color = "var(--gold)";
        }

        function cookPocion() {
            const op1 = document.getElementById('op1').innerText;
            const op2 = document.getElementById('op2').innerText;
            const n1 = parseInt(document.getElementById('n1').innerText);
            const n2 = parseInt(document.getElementById('n2').innerText);
            const n3 = parseInt(document.getElementById('n3').innerText);

            if (op1 === "?" || op2 === "?") {
                showMsg("¡Faltan ingredientes!", "var(--red)");
                return;
            }

            const map = { '+': '+', '-': '-', '×': '*', '÷': '/' };
            const expression = `${n1} ${map[op1]} ${n2} ${map[op2]} ${n3}`;
            sessionRound++;

            try {
                const result = eval(expression);
                if (result === currentTarget) {
                    score += 15;
                    sessionCorrect++;
                    document.getElementById('score').innerText = score;
                    showMsg("¡Perfecto! Poción lograda ⭐", "var(--green)");
                    if (sessionTotal > 0 && sessionRound >= sessionTotal) { setTimeout(endGame, 1000); }
                    else { setTimeout(generateMission, 1500); }
                } else {
                    sessionWrong++;
                    showMsg(`¡Explotó! Eso dio ${result}`, "var(--red)");
                }
            } catch (e) {
                sessionWrong++;
                showMsg("¡Hechizo fallido!", "var(--red)");
            }
        }

        function clearSlots() {
            document.getElementById('op1').innerText = "?";
            document.getElementById('op2').innerText = "?";
            document.getElementById('op1').style.color = "";
            document.getElementById('op2').style.color = "";
            if (activeSlot) activeSlot.classList.remove('active');
            activeSlot = null;
        }

        function showMsg(txt, col) {
            const f = document.getElementById('feedback');
            f.innerText = txt;
            f.style.backgroundColor = col;
            f.className = 'feedback-msg show';
            setTimeout(() => f.className = 'feedback-msg', 2500);
        }

        function endGame() {
            var totalTime = Math.round((Date.now() - sessionTimer) / 1000);
            RK.Stats.saveGameResult('juego6', {
                score: score,
                rounds: sessionRound,
                totalTime: totalTime,
                correct: sessionCorrect,
                wrong: sessionWrong,
                errors: ['orden de operaciones', 'PAPOMUDAS']
            });
            RK.Stats.showEndModal('El Caldero Mágico', {
                score: score,
                rounds: sessionRound,
                totalTime: totalTime,
                correct: sessionCorrect,
                wrong: sessionWrong
            });
        }
</script>
</body>
</html>
