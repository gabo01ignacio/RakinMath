<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>RakinMath - Página no encontrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="Recursos/LogoRakinMath.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: 'Inter', -apple-system, system-ui, sans-serif;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --spring-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --duo-green: #58cc02;
  --duo-green-dark: #46a302;
  --duo-blue: #1cb0f6;
  --duo-blue-dark: #1899d6;
  --duo-purple: #ce82ff;
  --duo-red: #ff4b4b;
  --duo-orange: #ff9600;
  --duo-yellow: #ffc800;
}

[data-theme="light"] {
  --bg: #f0f4f8;
  --bg-card: #ffffff;
  --text: #2d3748;
  --text-sec: #5a6577;
  --text-dim: #a0aec0;
  --border: rgba(0,0,0,0.06);
}

[data-theme="dark"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --text: #e6edf3;
  --text-sec: #8b949e;
  --text-dim: #484f58;
  --border: rgba(255,255,255,0.06);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.4s, color 0.4s;
}

/* ─── NAV ─── */
.nav {
  height: 56px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.88);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 2px solid var(--border);
  position: relative;
  z-index: 10;
}
[data-theme="dark"] .nav { background: rgba(13,17,23,0.88); }

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--text);
  transition: transform 0.3s var(--spring);
}
.nav-logo:hover { transform: scale(1.05) rotate(-1deg); }
.nav-logo img { height: 28px; width: auto; }
.nav-logo span { color: var(--duo-green); }

.nav-home {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--duo-green);
  background: rgba(88,204,2,0.08);
  border: 2px solid rgba(88,204,2,0.2);
  text-decoration: none;
  transition: all 0.25s var(--spring);
}
.nav-home:hover {
  background: var(--duo-green);
  color: white;
  border-color: var(--duo-green);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(88,204,2,0.3);
}

/* ─── MAIN ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
  position: relative;
}

/* Floating math symbols */
.floating-symbols {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.symbol {
  position: absolute;
  font-size: 2rem;
  font-weight: 800;
  opacity: 0.04;
  animation: floatSymbol 12s ease-in-out infinite;
}
.symbol:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; color: var(--duo-green); }
.symbol:nth-child(2) { top: 20%; right: 8%; animation-delay: 2s; color: var(--duo-blue); }
.symbol:nth-child(3) { bottom: 30%; left: 10%; animation-delay: 4s; color: var(--duo-purple); }
.symbol:nth-child(4) { bottom: 15%; right: 12%; animation-delay: 1s; color: var(--duo-orange); }
.symbol:nth-child(5) { top: 45%; left: 3%; animation-delay: 3s; color: var(--duo-red); }
.symbol:nth-child(6) { top: 55%; right: 5%; animation-delay: 5s; color: var(--duo-yellow); }
.symbol:nth-child(7) { top: 75%; left: 8%; animation-delay: 1.5s; color: var(--duo-green); }
.symbol:nth-child(8) { top: 85%; right: 15%; animation-delay: 3.5s; color: var(--duo-blue); }

@keyframes floatSymbol {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(5deg); }
  50% { transform: translateY(8px) rotate(-3deg); }
  75% { transform: translateY(-10px) rotate(2deg); }
}

/* ─── MASCOT ─── */
.mascot-wrap {
  position: relative;
  margin-bottom: 32px;
  animation: mascotBounce 0.8s var(--spring-bounce) both;
}
.mascot-wrap img {
  width: 180px;
  height: 180px;
  filter: drop-shadow(0 8px 24px rgba(175,82,222,0.25));
}

@keyframes mascotBounce {
  0% { opacity: 0; transform: scale(0.3) translateY(40px) rotate(-15deg); }
  60% { transform: scale(1.1) translateY(-10px) rotate(5deg); }
  100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
}

/* Floating question marks around mascot */
.q-mark {
  position: absolute;
  font-size: 1.5rem;
  font-weight: 900;
  animation: floatQ 2s ease-in-out infinite;
}
.q-mark:nth-child(2) { top: 10%; left: -20%; animation-delay: 0s; color: var(--duo-red); }
.q-mark:nth-child(3) { top: 5%; right: -15%; animation-delay: 0.5s; color: var(--duo-orange); }
.q-mark:nth-child(4) { bottom: 20%; left: -25%; animation-delay: 1s; color: var(--duo-blue); }

@keyframes floatQ {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
  50% { transform: translateY(-12px) rotate(10deg); opacity: 1; }
}

/* ─── TEXT ─── */
.error-code {
  font-size: clamp(5rem, 15vw, 9rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 1;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--duo-green), var(--duo-blue), var(--duo-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeInUp 0.6s var(--ease) 0.2s both;
}

.title {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 12px;
  animation: fadeInUp 0.6s var(--ease) 0.3s both;
}

.subtitle {
  font-size: 1.1rem;
  color: var(--text-sec);
  max-width: 420px;
  line-height: 1.6;
  margin-bottom: 40px;
  animation: fadeInUp 0.6s var(--ease) 0.4s both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── BUTTONS ─── */
.btn-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  animation: fadeInUp 0.6s var(--ease) 0.5s both;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 32px;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 800;
  background: var(--duo-green);
  color: white;
  border: none;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 5px 0 var(--duo-green-dark), 0 4px 20px rgba(88,204,2,0.3);
  transition: all 0.2s var(--spring);
  letter-spacing: -0.01em;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--duo-green-dark), 0 6px 30px rgba(88,204,2,0.4);
}
.btn-primary:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 var(--duo-green-dark);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 32px;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 800;
  background: var(--bg-card);
  color: var(--text);
  border: 2px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 4px 0 rgba(0,0,0,0.06);
  transition: all 0.2s var(--spring);
  letter-spacing: -0.01em;
}
.btn-secondary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 rgba(0,0,0,0.08);
  border-color: var(--duo-blue);
  color: var(--duo-blue);
}
.btn-secondary:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
}

/* ─── WAVE ─── */
.wave {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
}
.wave svg {
  display: block;
  width: 100%;
  height: 60px;
}

/* ─── FOOTER TEXT ─── */
.footer-text {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-dim);
  z-index: 1;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 480px) {
  .nav { padding: 0 16px; }
  .mascot-wrap img { width: 140px; height: 140px; }
  .btn-group { flex-direction: column; width: 100%; max-width: 280px; }
  .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
  .q-mark { display: none; }
}
</style>

<!-- SUPER RESPONSIVE MOBILE OPTIMIZATIONS — RAKINMATH -->
<style id="rakin-mobile-responsiveness">
* {
  -webkit-tap-highlight-color: transparent;
}
html, body {
  max-width: 100%;
  overflow-x: hidden;
}
img, svg, video, canvas {
  max-width: 100%;
}
button, a, input, select, textarea, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn {
  touch-action: manipulation;
}
@media (max-width: 600px) {
  input, select, textarea {
    font-size: 16px !important;
  }
  button, .btn, .choice-btn, .opt-btn, .game-btn, .nav-btn, .action-btn {
    min-height: 44px;
  }
}
</style>

</head>

<nav class="nav">

<main class="main">
  <div class="mascot-wrap">

    <span class="q-mark">?</span>
    <span class="q-mark">?</span>

  <h1 class="title">¡Ups! Rakín se perdió</h1>

  <div class="btn-group">

<!-- Wave separator -->
<div class="wave">
  <svg viewBox="0 0 1440 60" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0 30C240 50 480 10 720 30C960 50 1200 10 1440 30V60H0V30Z" fill="rgba(88,204,2,0.06)"/>

<div class="footer-text">RakinMath · Matemáticas que se sienten como un juego</div>

<script>
// Theme detection
(function() {
  var saved = localStorage.getItem('rakin_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
</body>
</html>
