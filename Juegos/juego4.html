<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="apple-design.css">
    <title>Arquitectas | RakinMath</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .top-bar {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar h1 { font-size: 1rem; font-weight: 700; }

        .score-pill {
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.875rem;
        }

        .game-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 14px;
            padding: 0 16px 16px;
            align-items: stretch;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-card-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .animal-emoji { font-size: 3rem; text-align: center; line-height: 1; }

        .speech {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        .mission-box {
            background: rgba(255,149,0,0.06);
            border: 1px solid rgba(255,149,0,0.12);
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: center;
        }

        .mission-type {
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
        }

        .mission-val {
            font-size: 2rem;
            font-weight: 800;
            color: #ff9500;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .mission-unit {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .check-btn {
            margin-top: auto;
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--accent);
            color: white;
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .check-btn:active { transform: scale(0.97); }

        /* Map area */
        .map-area {
            background: #e8f5e9;
            border-radius: var(--radius-lg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #c8e6c9;
        }

        .map-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Habitat — thick visible border */
        .habitat {
            position: absolute;
            background: rgba(0, 122, 255, 0.06);
            border: 3px solid #007aff;
            border-radius: 6px;
            min-width: 40px;
            min-height: 40px;
            transition: background 0.2s ease;
        }

        .resizer {
            width: 18px;
            height: 18px;
            background: var(--accent);
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            right: -9px;
            bottom: -9px;
            cursor: nwse-resize;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .dim-label {
            position: absolute;
            font-size: 0.6875rem;
            font-weight: 700;
            color: white;
            background: #1d1d1f;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .dim-w { top: -24px; left: 50%; transform: translateX(-50%); }
        .dim-h { right: -36px; top: 50%; transform: translateY(-50%) rotate(90deg); }

        .toast {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.75rem;
            color: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 700px) {
            .game-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { max-height: 240px; overflow-y: auto; }
            .top-bar { padding: var(--space-3) var(--space-4); }
            .top-bar h1 { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .game-layout { padding: 0 8px 8px; gap: 8px; }
            .map-container { height: 260px; }
            .sidebar { padding: var(--space-3); gap: var(--space-2); }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="menu.html" class="nav-title">
        <div class="nav-logo-icon">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 10V4h2l2.5 3.5L10 4h2v6h-1.5V6.5L8 10.5H7.5L5 6.5V10H3z" fill="white"/></svg>
        </div>
        <span>Arquitectas | Rakin<span class="brand">Math</span></span>
    </a>
    <a href="menu.html" class="exit-btn">Salir</a>
</nav>

<div class="top-bar">
    <h1>🏗️ Arquitectas de la Reserva</h1>
    <div class="score-pill">✅ <span id="score">0</span></div>
</div>

<div class="game-layout">
    <div class="sidebar">
        <div class="animal-emoji" id="animal-icon">🐘</div>
        <div class="speech" id="request-text">¡Hola! Necesito espacio para correr.</div>

        <div class="mission-box">
            <div class="mission-type" id="target-type">Perímetro</div>
            <div class="mission-val" id="target-val">12</div>
            <div class="mission-unit" id="unit">metros</div>
        </div>

        <div class="stats-row">
            <span>📏 P: <b id="curr-p">0</b>m</span>
            <span>🟦 A: <b id="curr-a">0</b>m²</span>
        </div>

        <button class="check-btn" onclick="verify()">¡Listo, jefe! 🐾</button>
    </div>

    <div class="map-area" id="map">
        <div class="map-grid"></div>
        <div id="toast" class="toast"></div>

        <div id="habitat" class="habitat" style="width:120px;height:80px;left:0;top:0;cursor:grab;">
            <div class="dim-label dim-w" id="lbl-w">3m</div>
            <div class="dim-label dim-h" id="lbl-h">2m</div>
            <div class="resizer" id="handle"></div>
        </div>
    </div>
</div>

<script>
    let score=0, targetValue=12, isAreaMission=false;
    const missions = [
        {icon:'🐘',txt:'¡Soy un Elefante! Necesito mucho borde para mi valla.',type:'Perímetro',val:16},
        {icon:'🐯',txt:'Soy un Tigre. Necesito mucho espacio interno para jugar.',type:'Área',val:12},
        {icon:'🦒',txt:'¡Hola! Mi cuello es largo, pero mi casa debe tener un...',type:'Perímetro',val:20},
        {icon:'🦓',txt:'¡Rayas por doquier! Quiero un área exacta de...',type:'Área',val:8},
        {icon:'🐒',txt:'¡Uhh ahh! Hazme un corral con perímetro de...',type:'Perímetro',val:14}
    ];

    const habitat = document.getElementById('habitat');
    const handle = document.getElementById('handle');
    const map = document.getElementById('map');
    let dragging = false;
    let dragMode = null;

    handle.addEventListener('pointerdown', e => { dragMode='resize'; dragging=true; handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    habitat.addEventListener('pointerdown', e => {
        if (e.target === handle) return;
        dragMode='move'; dragging=true;
        habitat.setPointerCapture(e.pointerId);
        e.preventDefault();
    });

    window.addEventListener('pointermove', e => {
        if (!dragging) return;
        const mapRect = map.getBoundingClientRect();
        const CELL = 40;

        if (dragMode === 'resize') {
            const rect = habitat.getBoundingClientRect();
            let nw = Math.max(CELL, Math.round((e.clientX-rect.left)/CELL)*CELL);
            let nh = Math.max(CELL, Math.round((e.clientY-rect.top)/CELL)*CELL);
            habitat.style.width = nw+'px';
            habitat.style.height = nh+'px';
        } else if (dragMode === 'move') {
            habitat.style.cursor = 'grabbing';
            const habRect = habitat.getBoundingClientRect();
            let nx = Math.round((e.clientX - mapRect.left - habRect.width/2) / CELL) * CELL;
            let ny = Math.round((e.clientY - mapRect.top - habRect.height/2) / CELL) * CELL;
            nx = Math.max(0, Math.min(mapRect.width - habRect.width, nx));
            ny = Math.max(0, Math.min(mapRect.height - habRect.height, ny));
            habitat.style.left = nx + 'px';
            habitat.style.top = ny + 'px';
        }
        updateStats();
    });
    window.addEventListener('pointerup', () => { dragging=false; dragMode=null; habitat.style.cursor='grab'; });

    function updateStats() {
        const w = parseInt(habitat.style.width)/40;
        const h = parseInt(habitat.style.height)/40;
        document.getElementById('curr-p').textContent = 2*(w+h);
        document.getElementById('curr-a').textContent = w*h;
        document.getElementById('lbl-w').textContent = w+'m';
        document.getElementById('lbl-h').textContent = h+'m';
    }

    function verify() {
        const p = parseInt(document.getElementById('curr-p').textContent);
        const a = parseInt(document.getElementById('curr-a').textContent);
        const val = isAreaMission ? a : p;
        if (val === targetValue) {
            score++;
            document.getElementById('score').textContent = score;
            notify('¡Perfecto! El animal está feliz ✨', '#34c759');
            setTimeout(newMission, 1200);
        } else {
            notify('¡Casi! Tu '+(isAreaMission?'Área':'Perímetro')+' es '+val, '#ff3b30');
        }
    }

    function notify(txt, col) {
        const t = document.getElementById('toast');
        t.textContent = txt;
        t.style.backgroundColor = col;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function newMission() {
        const m = missions[~~(Math.random()*missions.length)];
        isAreaMission = m.type==='Área';
        targetValue = m.val;
        document.getElementById('animal-icon').textContent = m.icon;
        document.getElementById('request-text').textContent = m.txt;
        document.getElementById('target-type').textContent = m.type;
        document.getElementById('target-val').textContent = targetValue;
        document.getElementById('unit').textContent = isAreaMission ? 'metros²' : 'metros';
        habitat.style.background = isAreaMission ? 'rgba(0,122,255,0.08)' : 'rgba(0,122,255,0.04)';
    }

    newMission();
    updateStats();
</script>
</body>
</html>
